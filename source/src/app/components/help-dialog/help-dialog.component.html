<div class="help-dialog-container">
    <h2 mat-dialog-title>
        <mat-icon class="title-icon">help_outline</mat-icon>
        Help Information
    </h2>

    <mat-dialog-content>
        <section class="dialog-section">
            <h3>Fitness Criteria</h3>
            <div [innerHTML]="data.criteria"></div>
        </section>

        <section class="dialog-section">
            <h3>Notes</h3>
            <div [innerHTML]="data.notes"></div>
        </section>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-stroked-button color="primary" mat-dialog-close>Close</button>
    </mat-dialog-actions>
</div>
