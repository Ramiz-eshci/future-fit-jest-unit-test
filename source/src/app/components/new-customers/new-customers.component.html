<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="hstack align-items-center p-b-4">
      <div class="rounded icon-48 bg-light-accent d-flex align-items-center flex-shrink-0 justify-content-center">
        <i class="iconify f-s-24 text-accent" [attr.data-icon]="icon"></i>
      </div>
      <mat-card-title class="f-s-16 f-w-500 m-b-0">Total {{title}} - {{countValue}}</mat-card-title>
    </div>

  </mat-card-content>
