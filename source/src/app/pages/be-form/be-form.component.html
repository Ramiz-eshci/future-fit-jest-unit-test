<mat-card class="cardWithShadow theme-card">
    <mat-card-header>
        <mat-card-title class="m-b-0">{{title}} List</mat-card-title>
    </mat-card-header>
    <mat-card-content class="">
        <div class="row align-items-center mb-3">
            <!-- <div class="col-md-3">
                <a [routerLink]="['/manufacturers/add']" mat-flat-button color="primary" #tooltip="matTooltip"
                    matTooltip="Add New {{title}}" matTooltipPosition="above">
                    <mat-icon>add</mat-icon> Add New
                </a>
            </div> -->
            <div class="col-md-3">
                <!-- <a [routerLink]="['/be-form/add']" mat-flat-button color="primary" #tooltip="matTooltip"
                    matTooltip="Add New {{title}}" matTooltipPosition="above">
                    <mat-icon>add</mat-icon> Add New
                </a> -->
            </div>
            <div class="col-md-3">
            </div>
            <div class="col-md-3">
            </div>
            <div class="col-md-3 text-end">
                <mat-form-field class="w-100" appearance="outline">
                    <mat-label>Search</mat-label>
                    <input matInput placeholder="Search" (input)="applyFilter($event)" />
                </mat-form-field>
            </div>
        </div>

        <table mat-table [dataSource]="dataSource" class="listing-table w-100">

            <!-- Column Definitions -->
            <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
                <th mat-header-cell *matHeaderCellDef>{{ column | formatColumn }}</th>

                <td mat-cell *matCellDef="let mfr">
                    <!-- Check if the column is for an image -->
                    <ng-container *ngIf="column === 'Image'; else checkLink">
                        <span class="mobile-label">{{ column | formatColumn }}:</span>
                        <img [src]="mfr[column]" alt="Image" style="width: 50px; height: 50px;" />
                    </ng-container>

                    <!-- Fallback for all non-image columns -->
                    <ng-template #checkLink>
                        <ng-container *ngIf="column === 'goal_code'; else normalCell">
                            <span class="mobile-label">{{ column | formatColumn }}:</span>
                            <span class="clickable-fit" (click)="onFitClick(mfr.goal_code)">
                                {{ mfr[column] }}
                            </span>
                        </ng-container>
                    </ng-template>

                    <ng-template #normalCell>
                        <span class="mobile-label">{{ column | formatColumn }}:</span>
                        {{ mfr[column] }}
                    </ng-template>
                </td>
            </ng-container>

            <!-- Action Column Definition -->
            <!-- <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let mfr">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="deleteFutureFitList(mfr.fit_entry_id)">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container> -->

            <!-- Header Row -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell"
                    [attr.colspan]="RoleID == 1 ? displayedColumns.length + 1 : displayedColumns.length"
                    style="text-align: center;">
                    No records found.
                </td>
            </tr>

            <!-- Data Row -->
            <tr mat-row *matRowDef="let mfrrow; columns: displayedColumns"></tr>
        </table>

        <!-- Loading Indicator -->
        <!-- <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar> -->

        <!-- Paginator -->
        <mat-paginator #paginator [length]="totalData" [pageSizeOptions]="pageSizes"
            showFirstLastButtons></mat-paginator>

    </mat-card-content>
</mat-card>
