<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">{{ title }} List</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row align-items-center mb-3">
      <div class="col-md-3" *ngIf="canAdd ; else emptyCol">
        <a [routerLink]="['/purchase/add']" mat-flat-button color="primary" #tooltip="matTooltip"
          matTooltip="Add New {{ title }}" matTooltipPosition="above">
          <mat-icon>add</mat-icon> Add New
        </a>
      </div>
       <ng-template #emptyCol>
                <div class="col-md-3"></div>
            </ng-template>
      <div class="col-md-3"></div>
      <div class="col-md-3"></div>
      <div class="col-md-3 text-end">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Search</mat-label>
          <input matInput placeholder="Search" (input)="applyFilter($event)" />
        </mat-form-field>
      </div>
    </div>

    <table mat-table [dataSource]="dataSource" class="listing-table w-100">


      <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef>{{ column | formatColumn }}</th>
         
        <td mat-cell *matCellDef="let row">
          <span class="mobile-label">{{ column | formatColumn }}:</span>

        
          <ng-container *ngIf="column == 'year'; else checkCost">
            <div class="multi-line-wrapper">
              <ng-container *ngFor="let y of row.year?.split(',')">
                <div class="multi-line-item">{{ y.trim() }}</div>
              </ng-container>
            </div>
          </ng-container>

           
          <ng-template #checkCost>
            <ng-container *ngIf="column == 'cost'; else normalCell">
              <div class="multi-line-wrapper">
                <ng-container *ngFor="let c of row.cost?.split(',')">
                  <!-- <div class="multi-line-item">{{ c.trim() }}</div> -->
                    <div class="multi-line-item">{{ c.trim() | number }}</div>
                </ng-container>
              </div>
            </ng-container>
          </ng-template>

          <!-- Default Columns -->
          <ng-template #normalCell>
            {{ row[column] }}
          </ng-template>
        </td>

      </ng-container>


      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <a mat-menu-item [routerLink]="['/purchase/edit', row.purchase_information_id]" *ngIf="canEdit">
              <mat-icon>edit</mat-icon>
              <span>Edit</span>
            </a>
            <button mat-menu-item (click)="deletePurchase(row.purchase_information_id)" *ngIf="canDelete">
              <mat-icon>delete</mat-icon>
              <span>Delete</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(['actions'])"></tr>


      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length + 1" style="text-align: center">
          No records found.
        </td>
      </tr>


      <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(['actions'])"></tr>
    </table>


    <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>


    <mat-paginator #paginator [length]="totalData" [pageSizeOptions]="pageSizes" showFirstLastButtons>
    </mat-paginator>
  </mat-card-content>
</mat-card>
