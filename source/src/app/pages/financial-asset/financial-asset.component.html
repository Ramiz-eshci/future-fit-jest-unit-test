<mat-card class="cardWithShadow theme-card">
    <mat-card-header>
        <mat-card-title class="m-b-0">{{ title }} List</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="row align-items-center mb-3">
            <div class="col-md-3" *ngIf="canAdd ;else emptyCol">
                <a [routerLink]="['/financial/add']" mat-flat-button color="primary" #tooltip="matTooltip"
                    matTooltip="Add New {{ title }}" matTooltipPosition="above">
                    <mat-icon>add</mat-icon> Add New
                </a>
            </div>
             <ng-template #emptyCol>
                <div class="col-md-3"></div>
            </ng-template>
            <div class="col-md-3"></div>
            <div class="col-md-3"></div>
            <div class="col-md-3 text-end">
                <mat-form-field class="w-100" appearance="outline">
                    <mat-label>Search</mat-label>
                    <input matInput placeholder="Search" (input)="applyFilter($event)" />
                </mat-form-field>
            </div>
        </div>

        <table mat-table [dataSource]="dataSource" class="listing-table w-100">

            <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
                <th mat-header-cell *matHeaderCellDef>{{ column | formatColumn }}</th>
                
                <td mat-cell *matCellDef="let row">
                    <span class="mobile-label">{{ column | formatColumn }}:</span>

                    
                    <ng-container *ngIf="column == 'year'; else checkMonetary">
                        <div class="year-value-wrapper">
                            <ng-container *ngFor="let y of (row?.year || '').split(',')">
                                <div class="year-item">{{ y.trim() }}</div>
                            </ng-container>
                        </div>
                    </ng-container>

                    
                    <ng-template #checkMonetary>
                        <!-- <ng-container *ngIf="column == 'monetary_value'; else defaultColumn">
                            <div class="year-value-wrapper">
                                <ng-container *ngFor="let val of (row?.monetary_value || '').split(',')">
                                    <div class="monetary-item">{{ val.trim() }}</div>
                                </ng-container>
                            </div>
                        </ng-container> -->
                        <ng-container *ngIf="column == 'monetary_value'; else defaultColumn">
    <div class="year-value-wrapper">
        <ng-container *ngFor="let val of (row?.monetary_value || '').split(',')">
            <div class="monetary-item">{{ val.trim() | number }}</div>
        </ng-container>
    </div>
</ng-container>

                    </ng-template>

                    <!-- Default Column -->
                    <ng-template #defaultColumn>
                        {{ row[column] }}
                    </ng-template>
                </td>



            </ng-container>


            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        <a mat-menu-item [routerLink]="['/financial/edit', row.finanical_id]" *ngIf="canEdit">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                        </a>
                        <button mat-menu-item (click)="deleteFinancialAsset(row.finanical_id)" *ngIf="canDelete">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(['actions'])"></tr>


            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="
            RoleID == 1 ? displayedColumns.length + 1 : displayedColumns.length
          " style="text-align: center">
                    No records found.
                </td>
            </tr>


            <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(['actions'])"></tr>
        </table>


        <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>


        <mat-paginator #paginator [length]="totalData" [pageSizeOptions]="pageSizes"
            showFirstLastButtons></mat-paginator>
    </mat-card-content>
</mat-card>
