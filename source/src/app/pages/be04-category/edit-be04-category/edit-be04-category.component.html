<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Edit {{ title }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="b-t-1">
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="row">

       
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Category Name</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput placeholder="Enter Category Name" formControlName="category_name" />
          </mat-form-field>
          <validation-messages [control]="categoryForm.controls.category_name"></validation-messages>
          <div *ngIf="categoryForm.controls.category_name.touched && categoryForm.controls.category_name.errors?.pattern" 
       class="error-text">
    Only alphabets are allowed
  </div>
        </div>

      </div>

     
      <div class="m-t-12">
        <button type="submit" mat-flat-button color="primary" class="m-r-8" [disabled]="loading || !categoryForm.valid">
          <span *ngIf="!loading">Update</span>
          <mat-spinner *ngIf="loading" [diameter]="40" color="accent"></mat-spinner>
        </button>
        <a [routerLink]="['/be04-category']" mat-stroked-button color="warn">
          Cancel
        </a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
