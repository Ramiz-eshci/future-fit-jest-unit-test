<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">{{ title }} List</mat-card-title>
  </mat-card-header>

  <mat-card-content>
     <!-- [routerLink]="['/be04Category/add']" ADD the Route for Add button  -->
    <div class="row align-items-center mb-3">
      <div class="col-md-3">
        <!-- <a
         
          mat-flat-button
          color="primary"
          matTooltip="Add New {{ title }}"
          matTooltipPosition="above"
        >
          <mat-icon>add</mat-icon> Add New
        </a> -->
      </div>
      <div class="col-md-6"></div>
      <div class="col-md-3 text-end">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Search</mat-label>
          <input matInput placeholder="Search" (input)="applyFilter($event)" />
        </mat-form-field>
      </div>
    </div>

 
    <table mat-table [dataSource]="dataSource" class="listing-table w-100">

      
      <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef>{{ column | formatColumn }}</th>
        <td mat-cell *matCellDef="let row">
          <span class="mobile-label">{{ column | formatColumn }}:</span>
          {{ row[column] }}
        </td>
      </ng-container>

      <!-- Edit Route [routerLink]="['/be04Category/edit', row.category_id]" -->
       <!-- Delete Route (click)="deleteCategory(row.category_id)" -->
      <!-- <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <a mat-menu-item >
              <mat-icon>edit</mat-icon>
              <span>Edit</span>
            </a>
            <button mat-menu-item >
              <mat-icon>delete</mat-icon>
              <span>Delete</span>
            </button>
          </mat-menu>
        </td>
      </ng-container> -->

      
      <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(['actions'])"></tr> -->
       <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>


      
      <tr class="mat-row" *matNoDataRow>
        <td
          class="mat-cell"
          [attr.colspan]="displayedColumns.length + 1"
          style="text-align: center"
        >
          No records found.
        </td>
      </tr>

      
      <!-- <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(['actions'])"></tr> -->
       <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    
    <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>

    
    <mat-paginator
      #paginator
      [length]="totalData"
      [pageSizeOptions]="pageSizes"
      showFirstLastButtons
    >
    </mat-paginator>
  </mat-card-content>
</mat-card>
