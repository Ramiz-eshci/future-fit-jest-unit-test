<div class="blank-layout-container bg-light"
  style="min-height: 100vh; background: url('./assets/images/Login_bg.png') no-repeat center center / cover;">
  <div class="row w-100 h-100 justify-content-start align-items-start" style="padding-top: 80px; padding-left: 40px;">
    <div class="col-md-5">
      <h1 class="login-text">Open Source tools to <br> Transform your business</h1>
      <mat-card class="cardWithShadow boxed-auth"
        style="width: 100%; max-width: 380px; padding: 24px 28px; border-radius: 12px;">
        <mat-card-content>
          <div class="text-center mb-3">
            <a [routerLink]="['/dashboard']">
              <img src="./assets/images/logos/future_fit_logo.png" alt="logo" height="75" width="180" />
            </a>
          </div>

          <h5 class="text-center mb-3 font-weight-bold">Sign In</h5>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Username -->
            <div class="form-group mb-3">
              <label class="form-label">Username</label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput type="text" formControlName="Email" />
              </mat-form-field>
              <validation-messages [control]="loginForm.controls.Email"></validation-messages>
            </div>

            <!-- Password -->
            <div class="form-group mb-3">
              <label class="form-label">Password</label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput type="password" formControlName="Password" />
              </mat-form-field>
              <validation-messages [control]="loginForm.controls.Password"></validation-messages>
            </div>

            <!-- Remember & Forgot -->
            <div class="d-flex align-items-center justify-content-between mb-3">
              <mat-checkbox color="primary">Remember me</mat-checkbox>
              <a [routerLink]="['/authentication/forgot-password']"
                class="text-primary font-weight-semibold f-s-14">Forgot Password?</a>
            </div>

            <!-- Sign In Button -->
            <button style="background-color: #ff8d00;" type="submit" mat-flat-button color="primary" class="w-100">
              Sign In
            </button>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
