<mat-card class="cardWithShadow theme-card">
    <mat-card-header>
        <mat-card-title class="m-b-0">{{title}}</mat-card-title>
    </mat-card-header>
    <mat-card-content class="b-t-1">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="row">
                <div class="col-lg-6">
                    <mat-label class="f-w-600 m-b-8 d-block">First Name</mat-label>
                    <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input matInput placeholder="First Name" formControlName="firstName" />
                    </mat-form-field>
                    <validation-messages [control]="profileForm.controls.firstName"></validation-messages>
                </div>
                <div class="col-lg-6">
                    <mat-label class="f-w-600 m-b-8 d-block">Last Name</mat-label>
                    <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input matInput placeholder="Last Name" formControlName="lastName" />
                    </mat-form-field>
                    <validation-messages [control]="profileForm.controls.lastName"></validation-messages>
                </div>
                <div class="col-lg-6">
                    <mat-label class="f-w-600 m-b-8 d-block">Email</mat-label>
                    <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input matInput placeholder="Email" formControlName="email" readonly />
                    </mat-form-field>
                    <validation-messages [control]="profileForm.controls.email"></validation-messages>
                </div>
                <div class="col-lg-6">
                    <mat-label class="f-w-600 m-b-8 d-block">Phone Number</mat-label>
                    <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input matInput placeholder="Phone Number" formControlName="phoneNumber" maxlength="12" />
                    </mat-form-field>
                    <validation-messages [control]="profileForm.controls.phoneNumber"></validation-messages>
                    <div class="error" *ngIf="profileForm.get('phoneNumber')?.hasError('pattern')">
                        Only numeric values are allowed.
                    </div>
                </div>
                 <div class="col-lg-6"  >
                <mat-label class="f-w-600 m-b-8 d-block">Logo</mat-label>
                <div class="file-upload-container">
                    <input type="file" (change)="onFileSelected($event)" accept=".png, .jpg, .JPEG, .gif" #fileInput hidden />
                    <button mat-raised-button color="primary" type="button" (click)="fileInput.click()">
                        Choose File
                    </button>
                   
                </div>
                <span class="file-name" *ngIf="selectedFile">{{
                        selectedFile.name }}</span>
                <p *ngIf="errorMessage" class="error-text">{{ errorMessage
                    }}</p>
            </div>
            </div>

            <div class="m-t-12">
                <button type="submit" mat-flat-button color="primary" value="Submit" class="m-r-8"
                    [disabled]="loading || !profileForm.valid">
                    <span *ngIf="!loading">Submit</span>
                    <mat-spinner *ngIf="loading" [diameter]="25" color="accent"></mat-spinner>
                </button>
                <a [routerLink]="['/']" #tooltip="matTooltip" matTooltip="Back to Home" matTooltipPosition="above"
                    mat-stroked-button color="warn">Cancel</a>
            </div>
        </form>
    </mat-card-content>
</mat-card>
