<div class="blank-layout-container justify-content-center align-items-center bg-light" >
    <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
  
      <div class="col-lg-4 d-flex align-items-center">
        <mat-card class="cardWithShadow boxed-auth">
          <mat-card-content class="p-32">
            <div class="text-center">
              <a [routerLink]="['/dashboard']">
                <img src="./assets/images/logos/future_fit_logo.png" class="align-middle m-2" alt="logo" height="96" width="250" />
              </a>
            </div>
  
            <div class="or-border m-t-30">Forgot Password</div>
  
            <form class="m-t-30" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
              <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
              <mat-form-field appearance="outline" class="w-100" color="primary">
                <input matInput type="text" formControlName="Email" />
              </mat-form-field>
              <validation-messages [control]="forgotPasswordForm.controls.Email">
              </validation-messages>
            
              <button type="submit" mat-flat-button color="primary" value="Sign In" class="w-100">Forgot Password</button>
              <!-- <input type="submit" mat-flat-button color="primary" value="Sign In" class="w-100" /> -->
              <!-- input -->
            </form>
            <span class="d-block f-w-500 text-center m-t-24">Back to Sign In
              <a [routerLink]="['/authentication/login']" class="text-decoration-none text-primary f-w-500 f-s-14">
                Sign In</a>
            </span>
          </mat-card-content>
        </mat-card>
      </div>
      <div class="col-lg-6 d-flex align-items-center">
      </div>
    </div>
  </div>
