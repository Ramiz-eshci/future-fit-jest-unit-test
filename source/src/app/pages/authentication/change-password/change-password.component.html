<mat-card class="cardWithShadow theme-card">
    <mat-card-header>
        <mat-card-title class="m-b-0">{{title}}</mat-card-title>
    </mat-card-header>
    <mat-card-content class="b-t-1">
        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="row">
                <div class="col-lg-6">
                    <!-- input -->
                    <mat-label class="f-w-600 m-b-8 d-block">Old Password</mat-label>
                    <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input type="password" matInput placeholder="Old Password" formControlName="OldPassword"
                            maxlength="12" />
                    </mat-form-field>
                    <validation-messages [control]="changePasswordForm.controls.OldPassword"></validation-messages>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6">
                    <!-- input -->
                    <mat-label class="f-w-600 m-b-8 d-block">New Password</mat-label>
                    <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input type="password" matInput placeholder="New Password " formControlName="NewPassword"
                            maxlength="12" />
                    </mat-form-field>
                    <validation-messages [control]="changePasswordForm.controls.NewPassword"></validation-messages>
                </div>
                <div class="col-lg-6">
                    <!-- input -->
                    <mat-label class="f-w-600 m-b-8 d-block">Confirm Password</mat-label>
                    <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input type="password" matInput placeholder="Confirm Password "
                            formControlName="confirmPassword" maxlength="12" />
                    </mat-form-field>
                    <validation-messages [control]="changePasswordForm.controls.confirmPassword"></validation-messages>
                </div>
            </div>
            <div class="m-t-12">
                <!-- <button mat-flat-button color="primary" class="m-r-8">Submit</button> -->
                <button type="submit" mat-flat-button color="primary" value="Submit" class="m-r-8"
                    [disabled]="loading || !changePasswordForm.valid">
                    <span *ngIf="!loading">Submit</span>
                    <mat-spinner *ngIf="loading" [diameter]="40" color="accent"></mat-spinner>
                </button>
                <a [routerLink]="['/']" #tooltip="matTooltip" matTooltip="Back to Home" matTooltipPosition="above"
                    mat-stroked-button color="warn">Cancel</a>
            </div>
        </form>
    </mat-card-content>
</mat-card>
