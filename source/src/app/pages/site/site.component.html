<mat-card class="cardWithShadow theme-card">
    <mat-card-header>
        <mat-card-title class="m-b-0">{{title}} List</mat-card-title>
    </mat-card-header>
    <mat-card-content class="">
        <div class="row align-items-center mb-3">
            <div class="col-md-3" *ngIf="canAdd ; else emptyCol">
                <a [routerLink]="['/site/add']" mat-flat-button color="primary" #tooltip="matTooltip"
                    matTooltip="Add New {{title}}" matTooltipPosition="above" >
                    <mat-icon>add</mat-icon> Add New
                </a>
            </div>
             <ng-template #emptyCol>
                <div class="col-md-3"></div>
            </ng-template>
            <div class="col-md-3">
            </div>
            <div class="col-md-3">
            </div>
            <div class="col-md-3 text-end">
                <mat-form-field  class="w-100" appearance="outline">
                    <mat-label>Search</mat-label>
                    <input matInput placeholder="Search" (input)="applyFilter($event)" />
                </mat-form-field>
            </div>
        </div>

        <table mat-table [dataSource]="dataSource" class="listing-table w-100"> 
            <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
                <th mat-header-cell *matHeaderCellDef>{{ column | formatColumn }}</th>
                <td mat-cell *matCellDef="let emp"> 
                    <ng-container *ngIf="column === 'Image'; else normalCell">
                        <span class="mobile-label">{{ column | formatColumn }}:</span><img [src]="emp[column]"
                            alt="Image" style="width: 50px; height: 50px;" />
                    </ng-container> 

                  
                    <ng-template #normalCell>
                        <span class="mobile-label">{{ column | formatColumn }}:</span>{{ emp[column] }}
                    </ng-template>
                </td>
            </ng-container> 
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let emp">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        <a mat-menu-item [routerLink]="['/site/edit', emp.site_id]" *ngIf="canEdit">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                        </a>
                        <button mat-menu-item (click)="deleteCompany(emp.site_id)" *ngIf="canDelete">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container> 
            <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(['actions'])"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="RoleID == 1 ? displayedColumns.length + 1 : displayedColumns.length"
                  style="text-align: center;">
                  No records found.
                </td>
              </tr> 
            <tr mat-row *matRowDef="let emprow; columns: displayedColumns.concat(['actions'])"></tr>
        </table> 
        <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>
 
        <mat-paginator #paginator [length]="totalData" [pageSizeOptions]="pageSizes"
            showFirstLastButtons></mat-paginator>

    </mat-card-content>

</mat-card>
